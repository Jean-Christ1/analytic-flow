            properties:
              compliant:
                type: boolean
              score:
                type: number
              gaps:
                type: array
                items:
                  type: string
        high_risk_systems:
          type: integer
        pending_assessments:
          type: integer
        last_audit_date:
          type: string
          format: date

    GovernanceIncident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ai_system_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        incident_type:
          type: string
        severity:
