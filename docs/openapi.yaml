            usage_percentage:
              type: number
            remaining:
              type: number
            forecasted_spend:
              type: number

    BudgetList:
      type: object
      properties:
        budgets:
          type: array
          items:
            $ref: '#/components/schemas/Budget'

    # GreenOps Schemas
    CarbonRecord:
      type: object
      properties:
        id:
