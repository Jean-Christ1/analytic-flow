        last_sync_at:
          type: string
          format: date-time

    BillingAccountCreate:
      type: object
      required: [provider, account_id, account_name]
      properties:
        provider:
          type: string
          enum: [aws, gcp, azure]
        account_id:
          type: string
        account_name:
          type: string
        credentials:
          type: object

    BillingAccountList:
      type: object
      properties:
        billing_accounts:
          type: array
          items:
            $ref: '#/components/schemas/BillingAccount'

    CostRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        billing_account_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        service:
          type: string
        resource_type:
          type: string
        cost_amount:
          type: number
        currency:
          type: string
        usage_date:
          type: string
          format: date

    CostRecordList:
      type: object
      properties:
        cost_records:
          type: array
          items:
            $ref: '#/components/schemas/CostRecord'
