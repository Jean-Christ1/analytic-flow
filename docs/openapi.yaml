          format: uuid
        project_id:
          type: string
          format: uuid
        resource_type:
          type: string
        region:
          type: string
        energy_kwh:
          type: number
        carbon_kg:
          type: number
        measurement_date:
          type: string
          format: date

    CarbonRecordList:
      type: object
      properties:
        carbon_records:
          type: array
          items:
