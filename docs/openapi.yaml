              format: date
            end:
              type: string
              format: date
        by_region:
          type: object
          additionalProperties:
            type: number
        by_resource_type:
          type: object
          additionalProperties:
            type: number
        trend:
          type: object
          properties:
            change_percent:
              type: number
            direction:
              type: string
              enum: [up, down, stable]

    # Observability Schemas
    ObservabilityBackend:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [grafana, prometheus, loki, jaeger, datadog, newrelic]
        obs_type:
          type: string
          enum: [metrics, logs, traces]
        base_url:
          type: string
          format: uri
        status:
