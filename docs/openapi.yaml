          format: uuid
        ai_system_id:
          type: string
          format: uuid
        assessment_type:
          type: string
        risk_level:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [draft, pending_review, approved, rejected]
        risk_factors:
          type: object
        mitigation_measures:
          type: object
        assessment_date:
          type: string
          format: date

    RiskAssessmentCreate:
      type: object
      required: [ai_system_id, assessment_type]
      properties:
