          enum: [project, team, tenant]
        amount:
          type: number
        currency:
          type: string
        period:
          type: string
          enum: [monthly, quarterly, yearly]
        status:
          type: string
          enum: [active, exceeded, paused]

    BudgetCreate:
      type: object
      required: [name, budget_type, amount, period]
