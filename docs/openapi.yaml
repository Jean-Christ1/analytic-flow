          enum: [grafana, prometheus, loki, jaeger, datadog, newrelic]
        obs_type:
          type: string
          enum: [metrics, logs, traces]
        base_url:
          type: string
          format: uri
        api_key:
          type: string
        is_default:
          type: boolean
          default: false

    ObservabilityBackendList:
      type: object
      properties:
        backends:
          type: array
          items:
            $ref: '#/components/schemas/ObservabilityBackend'

    Incident:
