                measurement_window:
                  type: string
            latency_p99:
              type: object
              properties:
                target:
                  type: number
                unit:
                  type: string
        is_active:
          type: boolean

    SLAPolicyList:
      type: object
      properties:
        sla_policies:
          type: array
          items:
            $ref: '#/components/schemas/SLAPolicy'

