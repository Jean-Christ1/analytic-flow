            $ref: '#/components/schemas/Incident'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    SLAPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        scope_type:
          type: string
          enum: [tenant, project, deployment]
        targets:
          type: object
          properties:
