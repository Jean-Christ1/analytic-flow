# ============================================================================
# APEX-ML-PLATFORM - Standalone Docker Compose
# Version: 1.0.0
# Author: Armand AMOUSSOU
# Date: 2026-01-07
# ============================================================================
# This docker-compose file deploys a fully autonomous stack:
# - PostgreSQL 16 (database)
# - PgBouncer (connection pooling)
# - MinIO (S3-compatible object storage)
# - Keycloak (authentication - optional)
# - pgAdmin (database management - optional)
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # PostgreSQL 16 - Primary Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: apex-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-apex_ml_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./ssl:/etc/postgresql/ssl:ro
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-apex_ml_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    networks:
      - apex-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ==========================================================================
  # PgBouncer - Connection Pooling
  # ==========================================================================
  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: apex-pgbouncer
    hostname: pgbouncer
    restart: unless-stopped
    environment:
      PGBOUNCER_DATABASE: ${POSTGRES_DB:-apex_ml_platform}
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 50
      PGBOUNCER_MIN_POOL_SIZE: 10
      PGBOUNCER_RESERVE_POOL_SIZE: 25
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
      PGBOUNCER_AUTH_TYPE: scram-sha-256
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - apex-network

  # ==========================================================================
  # MinIO - S3-Compatible Object Storage
  # ==========================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: apex-minio
    hostname: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - apex-network
    deploy:
      resources:
        limits:
          memory: 2G

  # ==========================================================================
  # MinIO Client - Bucket Initialization
  # ==========================================================================
  minio-init:
    image: minio/mc:latest
    container_name: apex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set apex http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing apex/avatars;
      mc mb --ignore-existing apex/models;
      mc mb --ignore-existing apex/datasets;
      mc mb --ignore-existing apex/exports;
      mc mb --ignore-existing apex/experiments;
      mc mb --ignore-existing apex/artifacts;
      mc mb --ignore-existing apex/logs;
      mc anonymous set download apex/avatars;
      echo 'Buckets initialized successfully';
      exit 0;
      "
    networks:
      - apex-network

  # ==========================================================================
  # Keycloak - Authentication (Optional)
  # ==========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: apex-keycloak
    hostname: keycloak
    restart: unless-stopped
    profiles:
      - auth
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT:-8080}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - apex-network

  # ==========================================================================
  # pgAdmin - Database Management (Optional)
  # ==========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: apex-pgadmin
    hostname: pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@apex.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apex-network

  # ==========================================================================
  # Prometheus - Metrics (Optional)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: apex-prometheus
    hostname: prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - apex-network

  # ==========================================================================
  # Grafana - Dashboards (Optional)
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: apex-grafana
    hostname: grafana
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - apex-network

# ==========================================================================
# VOLUMES
# ==========================================================================
volumes:
  postgres_data:
    driver: local
    name: apex-postgres-data
  minio_data:
    driver: local
    name: apex-minio-data
  pgadmin_data:
    driver: local
    name: apex-pgadmin-data
  prometheus_data:
    driver: local
    name: apex-prometheus-data
  grafana_data:
    driver: local
    name: apex-grafana-data

# ==========================================================================
# NETWORKS
# ==========================================================================
networks:
  apex-network:
    driver: bridge
    name: apex-network
    ipam:
      config:
        - subnet: 172.28.0.0/16
