# ============================================================================
# APEX-ML-PLATFORM - PostgreSQL 16 Configuration
# Version: 1.0.0
# Author: Armand AMOUSSOU
# Date: 2026-01-07
# ============================================================================
# Optimized for MLOps workloads with mixed OLTP/OLAP patterns
# Adjust values based on available system resources
# ============================================================================

# ==========================================================================
# CONNECTION SETTINGS
# ==========================================================================

listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ==========================================================================
# MEMORY SETTINGS
# ==========================================================================

# Shared memory (25% of total RAM recommended)
shared_buffers = 2GB

# Work memory per operation (sort, hash)
work_mem = 64MB

# Maintenance operations memory
maintenance_work_mem = 512MB

# Effective cache size (75% of total RAM)
effective_cache_size = 6GB

# ==========================================================================
# WRITE-AHEAD LOG (WAL)
# ==========================================================================

wal_level = replica
wal_buffers = 64MB
checkpoint_completion_target = 0.9
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_timeout = 10min
archive_mode = off

# ==========================================================================
# QUERY PLANNER
# ==========================================================================

default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

# ==========================================================================
# PARALLEL QUERY
# ==========================================================================

max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4
parallel_tuple_cost = 0.01
parallel_setup_cost = 100

# ==========================================================================
# LOGGING
# ==========================================================================

logging_collector = on
log_destination = 'stderr'
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# What to log
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'ddl'
log_error_verbosity = verbose

# ==========================================================================
# AUTOVACUUM
# ==========================================================================

autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000

# ==========================================================================
# REPLICATION (if needed)
# ==========================================================================

max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on

# ==========================================================================
# SECURITY
# ==========================================================================

password_encryption = scram-sha-256
ssl = off
# Enable SSL in production:
# ssl = on
# ssl_cert_file = '/etc/postgresql/ssl/server.crt'
# ssl_key_file = '/etc/postgresql/ssl/server.key'
# ssl_ca_file = '/etc/postgresql/ssl/ca.crt'

# ==========================================================================
# ROW LEVEL SECURITY
# ==========================================================================

row_security = on

# ==========================================================================
# EXTENSIONS
# ==========================================================================

shared_preload_libraries = 'pg_stat_statements'

# pg_stat_statements configuration
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# ==========================================================================
# LOCALE AND ENCODING
# ==========================================================================

lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# ==========================================================================
# TIMEZONE
# ==========================================================================

timezone = 'UTC'
log_timezone = 'UTC'

# ==========================================================================
# STATEMENT BEHAVIOR
# ==========================================================================

statement_timeout = 300000
lock_timeout = 60000
idle_in_transaction_session_timeout = 600000

# ==========================================================================
# JSONB OPTIMIZATION
# ==========================================================================

# Enable JIT for complex queries (PostgreSQL 16)
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000
